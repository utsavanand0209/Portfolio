<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgInternship" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3c72;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a5298;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentInternship" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="300" fill="url(#bgInternship)"/>
  <rect width="400" height="60" fill="url(#accentInternship)"/>
  
  <!-- Graduation Cap Icon -->
  <g transform="translate(200, 90)">
    <!-- Cap top -->
    <polygon points="0,-25 -40,0 40,0" fill="#fff"/>
    <!-- Cap board -->
    <rect x="-35" y="0" width="70" height="8" rx="2" fill="#fff"/>
    <!-- Tassel -->
    <line x1="0" y1="8" x2="0" y2="35" stroke="#00d4ff" stroke-width="3"/>
    <circle cx="0" cy="38" r="4" fill="#00d4ff"/>
  </g>
  
  <!-- Text Content -->
  <text x="200" y="200" text-anchor="middle" font-family="Poppins, sans-serif" font-size="24" font-weight="700" fill="#fff">Software Engineering</text>
  <text x="200" y="230" text-anchor="middle" font-family="Poppins, sans-serif" font-size="22" font-weight="700" fill="#fff">Trainee</text>
  <text x="200" y="260" text-anchor="middle" font-family="Poppins, sans-serif" font-size="14" fill="#00d4ff" font-weight="600">YuvaIntern - 2026</text>
  
  <circle cx="50" cy="50" r="3" fill="#fff" opacity="0.6"/>
  <circle cx="350" cy="250" r="3" fill="#fff" opacity="0.6"/>
</svg>
