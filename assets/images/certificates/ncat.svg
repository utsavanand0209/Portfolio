<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgNCAT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentNCAT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd900;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff9500;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main Background -->
  <rect width="400" height="300" fill="url(#bgNCAT)"/>
  
  <!-- Decorative Top Bar -->
  <rect width="400" height="60" fill="url(#accentNCAT)"/>
  
  <!-- Trophy Icon -->
  <g transform="translate(200, 80)">
    <!-- Trophy body -->
    <path d="M -25 10 Q -30 0 -20 -20 L 20 -20 Q 30 0 25 10 L 25 30 Q 0 40 -25 30 Z" fill="#fff" stroke="#667eea" stroke-width="2"/>
    <!-- Trophy handle left -->
    <path d="M -25 0 Q -50 -5 -50 15" fill="none" stroke="#fff" stroke-width="3"/>
    <!-- Trophy handle right -->
    <path d="M 25 0 Q 50 -5 50 15" fill="none" stroke="#fff" stroke-width="3"/>
    <!-- Trophy base -->
    <rect x="-35" y="35" width="70" height="8" rx="2" fill="#fff"/>
    <!-- Star on top -->
    <text x="0" y="-35" text-anchor="middle" font-size="24" fill="#ffd900">★</text>
  </g>
  
  <!-- Text Content -->
  <text x="200" y="200" text-anchor="middle" font-family="Poppins, sans-serif" font-size="24" font-weight="700" fill="#fff">NCAT EXAM</text>
  <text x="200" y="230" text-anchor="middle" font-family="Poppins, sans-serif" font-size="16" fill="rgba(255,255,255,0.9)">Naukri - 2025</text>
  <text x="200" y="260" text-anchor="middle" font-family="Poppins, sans-serif" font-size="14" fill="#ffd900" font-weight="600">Rank 6423</text>
  
  <!-- Decorative elements -->
  <circle cx="50" cy="50" r="3" fill="#fff" opacity="0.6"/>
  <circle cx="350" cy="250" r="3" fill="#fff" opacity="0.6"/>
  <circle cx="380" cy="80" r="2" fill="#ffd900" opacity="0.7"/>
</svg>
